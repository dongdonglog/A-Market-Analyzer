apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-go
  namespace: market-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-go
  template:
    metadata:
      labels:
        app: ai-go
    spec:
      containers:
        - name: ai-go
          image: donglog/market-backend:latest
          imagePullPolicy: Always
          command: ["ai-server"]
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: market-config
            - secretRef:
                name: market-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-go
  namespace: market-project
spec:
  selector:
    app: ai-go
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-go
  namespace: market-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-go
  template:
    metadata:
      labels:
        app: api-go
    spec:
      containers:
        - name: api-go
          image: donglog/market-backend:latest
          imagePullPolicy: Always
          command: ["api-server"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: market-config
            - secretRef:
                name: market-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-go
  namespace: market-project
spec:
  selector:
    app: api-go
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: market-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: donglog/market-frontend:latest
          imagePullPolicy: Always
          env:
            - name: API_PROXY_TARGET
              value: http://api-go.market-project.svc.cluster.local:8080
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: market-project
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
