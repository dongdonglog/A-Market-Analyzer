apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-go
  namespace: market-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-go
  template:
    metadata:
      labels:
        app: api-go
    spec:
      containers:
        - name: api-go
          image: market-project/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["api-server"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: market-config
            - secretRef:
                name: market-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-go
  namespace: market-project
spec:
  selector:
    app: api-go
  ports:
    - name: http
      port: 8080
      targetPort: 8080
