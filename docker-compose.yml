services:
  postgres:
    image: postgres:16
    container_name: market-postgres
    environment:
      POSTGRES_DB: market_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market_copilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: market-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-go:
    image: donglog/market-backend:latest
    container_name: market-ai-go
    command: ["ai-server"]
    environment:
      AI_PORT: 8081
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/market_copilot?sslmode=disable
      AI_SERVICE_URL: http://ai-go:8081
      REDIS_ADDR: redis:6379
      EMBEDDED_POSTGRES: "false"
      DEMO_EMAIL: trader@example.com
      DEMO_PASSWORD: market123456
      DEFAULT_AI_PROVIDER: deepseek
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_MODEL: gpt-5.5
      DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
      DEEPSEEK_MODEL: deepseek-v4-flash
      JWT_SECRET: change-me-before-production
      REDIS_ENABLED: "true"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
      TRACKED_SYMBOLS: 600519,000001,300750
      AI_USER_RATE_LIMIT: "20"
      AI_IP_RATE_LIMIT: "60"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"

  api-go:
    image: donglog/market-backend:latest
    container_name: market-api-go
    command: ["api-server"]
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/market_copilot?sslmode=disable
      AI_SERVICE_URL: http://ai-go:8081
      REDIS_ADDR: redis:6379
      EMBEDDED_POSTGRES: "false"
      CORS_ORIGINS: http://localhost:4173,http://127.0.0.1:4173,http://localhost:5173,http://127.0.0.1:5173
      DEMO_EMAIL: trader@example.com
      DEMO_PASSWORD: market123456
      ADMIN_EMAILS: trader@example.com
      DEFAULT_AI_PROVIDER: deepseek
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_MODEL: gpt-5.5
      DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
      DEEPSEEK_MODEL: deepseek-v4-flash
      JWT_SECRET: change-me-before-production
      REDIS_ENABLED: "true"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
      TRACKED_SYMBOLS: 600519,000001,300750
      AI_USER_RATE_LIMIT: "20"
      AI_IP_RATE_LIMIT: "60"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-go:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    image: donglog/market-frontend:latest
    container_name: market-frontend
    environment:
      API_PROXY_TARGET: http://api-go:8080
    depends_on:
      api-go:
        condition: service_started
    ports:
      - "4173:80"

volumes:
  postgres-data:
  redis-data:
