services:
  postgres:
    image: postgres:16
    container_name: market-postgres
    environment:
      POSTGRES_DB: market_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market_copilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: market-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-go:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: market-ai-go
    command: ["ai-server"]
    env_file:
      - ./apps/backend/.env.example
    environment:
      AI_PORT: 8081
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/market_copilot?sslmode=disable
      AI_SERVICE_URL: http://ai-go:8081
      REDIS_ADDR: redis:6379
      EMBEDDED_POSTGRES: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"

  api-go:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: market-api-go
    command: ["api-server"]
    env_file:
      - ./apps/backend/.env.example
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/market_copilot?sslmode=disable
      AI_SERVICE_URL: http://ai-go:8081
      REDIS_ADDR: redis:6379
      EMBEDDED_POSTGRES: "false"
      CORS_ORIGINS: http://localhost:4173,http://127.0.0.1:4173,http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-go:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_COPILOT_API_BASE_URL:
    container_name: market-frontend
    depends_on:
      api-go:
        condition: service_started
    ports:
      - "4173:80"

volumes:
  postgres-data:
  redis-data:
